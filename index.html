,255,.15);background:rgba(255,255,255,.035);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:.15s}.slot.active{border:2px solid var(--lime);background:rgba(204,245,104,.13);transform:translateY(-5px)}.slot .swatch{width:20px;height:20px;border:1px solid rgba(255,255,255,.35);box-shadow:inset -4px -4px rgba(0,0,0,.18)}.slot .label{font-size:8px;color:#d5dfd9;white-space:nowrap;transform:scaleX(.78)}.tool-icon{width:28px;height:28px;object-fit:contain;image-rendering:pixelated}.empty-icon{width:16px;height:16px;border:1px dashed rgba(255,255,255,.32)}.slot .count{position:absolute;right:5px;top:3px;font-family:'DotGothic16';font-size:11px;color:#fff;text-shadow:0 1px 4px #000}.slot .num{position:absolute;left:4px;top:3px;font-size:8px;color:#96a3a2}.crosshair{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 2px #000)}.crosshair:before,.crosshair:after{content:'';position:absolute;background:rgba(255,255,255,.9);border:1px solid rgba(15,30,34,.6)}.crosshair:before{width:2px;height:14px;left:6px;top:0}.crosshair:after{width:14px;height:2px;top:6px;left:0}.overlay{display:none}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(500px,calc(100vw - 38px));padding:38px 40px 31px;background:rgba(15,27,31,.83);border:1px solid rgba(255,255,255,.25);box-shadow:0 24px 80px rgba(12,28,35,.23);backdrop-filter:blur(18px);text-align:center}.eyebrow{font-size:10px;letter-spacing:.27em;color:var(--lime);font-weight:700}.card h1{font-family:'DotGothic16';font-size:clamp(31px,8vw,48px);font-weight:400;letter-spacing:.06em;margin:9px 0 7px}.card p{font-size:12px;line-height:1.9;color:#c6d2cf;margin:0 auto 22px;max-width:350px}.start{font-family:inherit;font-weight:700;letter-spacing:.09em;font-size:12px;color:#15231f;background:var(--lime);border:0;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #86a93b;transition:.12s}.start:hover{transform:translateY(-2px);box-shadow:0 7px 0 #86a93b}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #86a93b}.foot{margin-top:20px;font-size:9px;letter-spacing:.12em;color:#879491}
.coords{display:flex;align-items:center;gap:7px;padding:10px 13px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);font-family:'DotGothic16';font-size:11px;color:#dfe9e4}.coords span{color:#8faaa0;margin-left:5px}.coords b{font-weight:400;color:var(--lime);min-width:35px}.bottom{justify-content:center}.help{display:none}.crosshair{filter:none}.menu-overlay{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(7,17,20,.62);backdrop-filter:blur(7px);pointer-events:auto}.menu-overlay.show{display:grid}.menu-card{width:min(430px,calc(100vw - 36px));padding:30px 34px;background:rgba(15,27,31,.94);border:1px solid rgba(255,255,255,.25);box-shadow:0 24px 80px rgba(0,0,0,.28);text-align:center}.menu-card h1{font-family:'DotGothic16';font-size:30px;font-weight:400;margin:7px 0 20px}.menu-controls{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;text-align:left;font-size:11px;color:#d8e1dc;margin-bottom:23px}.menu-controls .key{display:inline-block}.menu-card .start{pointer-events:auto}
.bottom{flex-direction:column;align-items:center;justify-content:flex-end;gap:7px}.vitals{display:flex;flex-direction:row;align-items:center;gap:12px;padding:4px 8px;background:rgba(14,24,29,.54);border:1px solid rgba(255,255,255,.12)}.hearts,.hunger{display:flex;justify-content:center;gap:3px;line-height:1}.heart{font-size:17px;color:#ff5665;text-shadow:0 1px 3px #32151a}.food{font-size:14px;filter:drop-shadow(0 1px 2px #281910)}
.menu-card [hidden]{display:none!important}.menu-actions{display:flex;justify-content:center;gap:10px}.menu-button,.binding-button{font-family:inherit;color:#eef2e8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);padding:10px 18px;cursor:pointer}.menu-button:hover,.binding-button:hover{border-color:var(--lime)}#settingsPanel h1{margin-bottom:10px}#settingsPanel h2{font-size:13px;color:var(--lime);margin:10px 0}.binding-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;max-height:34vh;overflow-y:auto;padding:2px 4px 8px 0}.binding-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:#d8e1dc}.binding-button{min-width:72px;padding:5px 8px;font-family:monospace;font-size:11px}.binding-button.waiting{color:var(--lime);border-color:var(--lime)}.sensitivity-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:10px 0 5px;color:#d8e1dc}#sensitivity{width:100%;accent-color:var(--lime);pointer-events:auto}.back-button{margin-top:12px}.inventory-overlay{position:fixed;inset:0;z-index:4;display:none;place-items:center;background:rgba(5,12,14,.38);pointer-events:auto}.inventory-overlay.show{display:grid}.inventory-panel{padding:18px;background:rgba(15,27,31,.94);border:1px solid rgba(255,255,255,.3);box-shadow:0 20px 65px #0008}.inventory-panel h2{font:20px 'DotGothic16';text-align:center;margin:0 0 14px}.inventory-grid{display:grid;grid-template-columns:repeat(9,54px);gap:4px}.inventory-grid .slot{width:54px;height:54px;cursor:pointer;background:rgba(255,255,255,.08)}.inventory-grid .slot.active{transform:none}.inventory-grid .slot .label{display:none}.inventory-grid .slot .swatch{width:26px;height:26px}.inventory-grid .tool-icon{width:34px;height:34px}.inventory-grid .slot .count,.hotbar .slot .count{z-index:1}.slot .count{pointer-events:none}.inventory-separator{height:10px;border-bottom:1px solid #ffffff30;margin-bottom:10px}.cursor-item{position:fixed;z-index:10;display:none;pointer-events:none;width:48px;height:48px;align-items:center;justify-content:center;background:#162321d9;border:1px solid var(--lime);transform:translate(-50%,-50%)}.cursor-item.show{display:flex}.cursor-item .swatch{width:30px;height:30px}.cursor-item .tool-icon{width:36px;height:36px}.cursor-item b{position:absolute;right:2px;bottom:0;font-size:11px;text-shadow:0 1px 3px #000}@media(max-width:640px){.inventory-grid{grid-template-columns:repeat(9,34px);gap:3px}.inventory-grid .slot{width:34px;height:42px}.inventory-panel{padding:11px}.inventory-grid .tool-icon{width:27px;height:27px}}

.menu-card:has(#settingsPanel:not([hidden])){width:min(650px,calc(100vw - 36px));text-align:left;max-height:94vh;overflow-y:auto}#settingsPanel .eyebrow,#settingsPanel>h1,#settingsPanel>h2{text-align:center}.binding-list{grid-template-columns:1fr 1fr;max-height:45vh;gap:7px 10px;padding:4px}.binding-row{min-height:46px;padding:6px 8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:4px;font-size:12px}.binding-button{min-width:104px;min-height:32px;background:#253632;border:1px solid #91aa94;color:#fff;font-size:12px;font-weight:700}.binding-button.waiting{background:#4e5d27;color:#efffc7;border-color:var(--lime)}#settingsPanel .sensitivity-label,#settingsPanel #sensitivity{display:block;max-width:420px;margin-left:auto;margin-right:auto}#settingsPanel .back-button{display:block;margin:16px auto 0}@media(max-width:640px){.menu-card:has(#settingsPanel:not([hidden])){padding:20px 14px}.binding-list{grid-template-columns:1fr 1fr;gap:5px}.binding-row{font-size:11px;padding:5px}.binding-button{min-width:78px}}

<body>
<div id="game"></div>
<div id="ui"><div class="top"><div class="coords">X <b id="coordX">0.0</b><span>Y</span> <b id="coordY">0.0</b><span>Z</span> <b id="coordZ">0.0</b></div><div class="stats"><div class="pill">WORLD <b id="seed">----</b></div><div class="pill">拾った数 <b id="collected">0</b></div></div></div><div class="crosshair"></div><div class="bottom"><div class="vitals"><div class="hearts" id="hearts" aria-label="体力"></div><div class="hunger" id="hunger" aria-label="満腹度"></div></div><div class="hotbar" id="hotbar"></div></div></div>
<div class="menu-overlay" id="menu"><div class="menu-card"><div id="mainMenu"><h1>一時停止中</h1><div class="menu-actions"><button class="menu-button" id="openSettings">設定</button><button class="start" id="resume">ゲームに戻る</button></div></div><div id="settingsPanel" hidden><div class="eyebrow">SETTINGS</div><h1>設定</h1><h2>キー操作</h2><div class="binding-list" id="bindingList"></div><label class="sensitivity-label" for="sensitivity">マウス感度 <output id="sensitivityValue">1.0</output></label><input id="sensitivity" type="range" min="0.2" max="3" step="0.1" value="1"><button class="menu-button back-button" id="settingsBack">戻る</button></div></div></div>
<div id="inventoryOverlay" class="inventory-overlay"><div class="inventory-panel"><h2>インベントリ</h2><div id="inventoryGrid" class="inventory-grid"></div><div class="inventory-separator"></div><div id="inventoryHotbar" class="inventory-grid"></div></div></div><div id="cursorItem" class="cursor-item"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const SEED = 2026;
const TYPES = ['grass', 'dirt', 'stone', 'wood', 'leaves'];
const LABELS = { grass: '草', dirt: '土', stone: '石', wood: '木', leaves: '葉' };
const COLORS = { grass: 0x71ba55, dirt: 0x8d6243, stone: 0x8a9297, wood: 0x95633c, leaves: 0x4f914b };
const CSS_COLORS = { grass: '#71ba55', dirt: '#8d6243', stone: '#8a9297', wood: '#95633c', leaves: '#4f914b' };
const makeStack = (id, count = 1) => {
  const tool = id.startsWith('iron_');
  const labels = { iron_sword: '鉄の剣', iron_pickaxe: '鉄のツルハシ', iron_axe: '鉄の斧', stone: '石', wood: '木', dirt: '土', grass: '草', leaves: '葉' };
  return { id, label: labels[id] || id, ...(tool ? { tool: true } : { type: id }), count: tool ? 1 : count };
};
const HOTBAR = [makeStack('iron_sword'), makeStack('iron_pickaxe'), makeStack('iron_axe'), null, makeStack('stone', 8), makeStack('wood', 8), makeStack('dirt', 12), makeStack('grass', 24), makeStack('leaves', 6)];
const INVENTORY_SLOTS = Array(27).fill(null);
const blocks = new Map();
const drops = [];
const keys = Object.create(null);
const DEFAULT_BINDINGS = {
  forward: 'KeyW', back: 'KeyS', left: 'KeyA', right: 'KeyD', jump: 'Space',
  sneak: 'Tab', sprint: 'ShiftLeft', drop: 'KeyQ', inventory: 'KeyE',
  hotbar1: 'Digit1', hotbar2: 'Digit2', hotbar3: 'Digit3', hotbar4: 'Digit4', hotbar5: 'Digit5',
  hotbar6: 'Digit6', hotbar7: 'Digit7', hotbar8: 'Digit8', hotbar9: 'Digit9'
};
const BINDING_LABELS = {
  forward: '前進', back: '後退', left: '左移動', right: '右移動', jump: 'ジャンプ',
  sneak: 'スニーク', sprint: 'ダッシュ', drop: 'アイテムを落とす', inventory: 'インベントリ',
  hotbar1: 'スロット1', hotbar2: 'スロット2', hotbar3: 'スロット3', hotbar4: 'スロット4',
  hotbar5: 'スロット5', hotbar6: 'スロット6', hotbar7: 'スロット7', hotbar8: 'スロット8', hotbar9: 'スロット9'
};
const SETTINGS_STORAGE_KEY = 'blockland-controls-v1';
let bindings = { ...DEFAULT_BINDINGS };
let mouseSensitivity = 1;
let rebindingAction = null;
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || '{}');
  if (saved.bindings) for (const action of Object.keys(DEFAULT_BINDINGS)) {
    if (typeof saved.bindings[action] === 'string') bindings[action] = saved.bindings[action];
  }
  if (Number.isFinite(saved.sensitivity)) mouseSensitivity = THREE.MathUtils.clamp(saved.sensitivity, 0.2, 3);
} catch {}
function saveControlSettings() {
  try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify({ bindings, sensitivity: mouseSensitivity })); } catch {}
}
function formatBinding(code) {
  if (code === 'Space') return 'SPACE';
  if (code === 'Tab') return 'TAB';
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return `Num ${code.slice(6)}`;
  if (code === 'ShiftLeft') return '左Shift';
  if (code === 'ShiftRight') return '右Shift';
  return code.replace('Arrow', '矢印');
}
function renderBindingSettings() {
  const list = document.querySelector('#bindingList');
  if (!list) return;
  list.innerHTML = '';
  for (const [action, label] of Object.entries(BINDING_LABELS)) {
    const row = document.createElement('div');
    row.className = 'binding-row';
    const name = document.createElement('span');
    name.textContent = label;
    const button = document.createElement('button');
    button.className = `binding-button${rebindingAction === action ? ' waiting' : ''}`;
    button.type = 'button';
    button.textContent = rebindingAction === action ? 'キーを押す' : formatBinding(bindings[action]);
    button.addEventListener('click', () => {
      rebindingAction = action;
      renderBindingSettings();
    });
    row.append(name, button);
    list.appendChild(row);
  }
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd8ed);
scene.fog = new THREE.Fog(0x9bd8ed, 25, 62);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.rotation.order = 'YXZ';
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.querySelector('#game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9f6ff, 0x647956, 2.0));
const sun = new THREE.DirectionalLight(0xfff1ce, 2.6);
sun.position.set(-18, 32, 16);
scene.add(sun);

const materials = Object.fromEntries(TYPES.map(type => [type, new THREE.MeshLambertMaterial({ color: COLORS[type] })]));
const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
const instanceMeshes = new Map();
let blockInstances = [];
const coordKey = (x, y, z) => `${x},${y},${z}`;

function makeRandom(seed) {
  let state = seed >>> 0;
  return function random() {
    state += 0x6D2B79F5;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}
const random = makeRandom(SEED);
document.querySelector('#seed').textContent = SEED;

function terrainHeight(x, z) {
  return Math.floor(1.4 + Math.sin(x * 0.22 + SEED) * 1.5 + Math.cos(z * 0.21 + SEED * 0.03) * 1.3 + Math.sin((x + z) * 0.13) * 0.9);
}
function setBlock(x, y, z, type) {
  x = Math.round(x); y = Math.round(y); z = Math.round(z);
  const key = coordKey(x, y, z);
  if (blocks.has(key)) return false;
  blocks.set(key, { x, y, z, type });
  return true;
}

// Build a small fixed island. One InstancedMesh per block type keeps rendering light.
for (let x = -16; x <= 16; x++) {
  for (let z = -16; z <= 16; z++) {
    const distance = Math.hypot(x, z);
    if (distance > 16 || (distance > 12 && random() < (distance - 12) / 5)) continue;
    const top = terrainHeight(x, z);
    for (let y = -3; y <= top; y++) {
      setBlock(x, y, z, y === top ? 'grass' : y >= top - 2 ? 'dirt' : 'stone');
    }
    if (distance > 3 && top > 0 && random() < 0.075) {
      const trunkHeight = 3 + Math.floor(random() * 2);
      for (let y = 1; y <= trunkHeight; y++) setBlock(x, top + y, z, 'wood');
      for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) {
        for (let dy = trunkHeight - 1; dy <= trunkHeight + 2; dy++) {
          const radius = Math.abs(dx) + Math.abs(dz) + Math.max(0, dy - trunkHeight);
          if (radius <= 3 && random() > 0.13) setBlock(x + dx, top + dy, z + dz, 'leaves');
        }
      }
    }
  }
}

const instanceToBlock = new Map();
function rebuildBlockMeshes() {
  for (const mesh of instanceMeshes.values()) scene.remove(mesh);
  instanceMeshes.clear();
  instanceToBlock.clear();
  for (const type of TYPES) {
    const entries = [...blocks.values()].filter(block => block.type === type);
    if (!entries.length) continue;
    const mesh = new THREE.InstancedMesh(cubeGeometry, materials[type], entries.length);
    mesh.userData.blockType = type;
    const transform = new THREE.Object3D();
    entries.forEach((block, index) => {
      transform.position.set(block.x, block.y, block.z);
      transform.updateMatrix();
      mesh.setMatrixAt(index, transform.matrix);
      instanceToBlock.set(`${type}:${index}`, block);
    });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.computeBoundingSphere();
    scene.add(mesh);
    instanceMeshes.set(type, mesh);
  }
}
rebuildBlockMeshes();

const player = { pos: new THREE.Vector3(0, terrainHeight(0, 7) + 2.25, 7), vel: new THREE.Vector3(), yaw: 0, pitch: 0, onGround: false, sneaking: false, height: 2 };
let escapeBlockKey = null;
camera.position.copy(player.pos);
const raycaster = new THREE.Raycaster();
raycaster.far = 5;
const outline = new THREE.LineSegments(
  new THREE.EdgesGeometry(cubeGeometry),
  new THREE.LineBasicMaterial({ color: 0xfff4b0, transparent: true, opacity: 0.95, depthTest: true })
);
outline.scale.setScalar(1.015);
outline.visible = false;
scene.add(outline);
const breakTimes = { grass: 1000, dirt: 1000, leaves: 1000, wood: 2400, stone: 10000 };
function getBreakDuration(type) {
  const tool = HOTBAR[selected]?.id;
  const speed = type === 'leaves' && tool === 'iron_sword' ? 2.2
    : type === 'stone' && tool === 'iron_pickaxe' ? 14
    : type === 'wood' && tool === 'iron_axe' ? 2.6
    : 1;
  return breakTimes[type] / speed;
}
const fracturePaths = [
  [[32, 32], [28, 26], [21, 22], [18, 14], [11, 9]],
  [[28, 26], [22, 29], [14, 27], [7, 31]],
  [[21, 22], [24, 16], [22, 9], [26, 3]],
  [[32, 32], [38, 30], [43, 24], [50, 23], [57, 16]],
  [[38, 30], [40, 39], [47, 43], [53, 52]],
  [[32, 32], [30, 39], [25, 45], [22, 56]],
  [[38, 30], [46, 34], [54, 35], [61, 40]],
  [[28, 26], [25, 19], [15, 15], [8, 12]],
  [[30, 39], [36, 46], [36, 54], [42, 61]],
  [[43, 24], [41, 16], [46, 10], [45, 4]]
];
function makeCrackTexture(progress) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let total = 0;
  for (const path of fracturePaths) for (let i = 1; i < path.length; i++) total += Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
  let remaining = total * progress;
  for (const path of fracturePaths) {
    for (let i = 1; i < path.length && remaining > 0; i++) {
      const a = path[i - 1], b = path[i];
      const length = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const amount = Math.min(1, remaining / length);

        if (coordKey(block.x, block.y, block.z) === ignoredBlockKey) continue;
        const overlapsX = playerMin.x < bx + 0.5 && playerMax.x > bx - 0.5;
        const overlapsY = playerMin.y < by + 0.5 && playerMax.y > by - 0.5;
        const overlapsZ = playerMin.z < bz + 0.5 && playerMax.z > bz - 0.5;
        if (overlapsX && overlapsY && overlapsZ) return block;
      }
    }
  }
  return null;
}
function horizontalBlockOverlap(x, z, block) {
  return x - 0.3 < block.x + 0.5 && x + 0.3 > block.x - 0.5 &&
    z - 0.3 < block.z + 0.5 && z + 0.3 > block.z - 0.5;
}
function findLandingSurface(x, z, fromEyeY, toEyeY) {
  const fromFeet = fromEyeY - 1.65;
  const toFeet = toEyeY - 1.65;
  let best = null;
  for (const block of blocks.values()) {
    const top = block.y + 0.5;
    if (horizontalBlockOverlap(x, z, block) && top <= fromFeet + 0.001 && top > toFeet - 0.001 && (!best || top > best.top)) {
      best = { top };
    }
  }
  return best;
}
function findCeilingSurface(x, z, fromEyeY, toEyeY, bodyHeight) {
  const fromHead = fromEyeY - 1.65 + bodyHeight;
  const toHead = toEyeY - 1.65 + bodyHeight;
  let best = null;
  for (const block of blocks.values()) {
    const bottom = block.y - 0.5;
    if (horizontalBlockOverlap(x, z, block) && bottom >= fromHead - 0.001 && bottom < toHead + 0.001 && (!best || bottom < best.bottom)) {
      best = { bottom };
    }
  }
  return best;
}
function findJumpEscapeBlock() {
  const footY = player.pos.y - 1.65;
  const height = player.height;
  const middleY = footY + height / 2;
  const overlaps = [];
  for (const block of blocks.values()) {
    const overlapX = player.pos.x - 0.3 < block.x + 0.5 && player.pos.x + 0.3 > block.x - 0.5;
    const overlapZ = player.pos.z - 0.3 < block.z + 0.5 && player.pos.z + 0.3 > block.z - 0.5;
    const overlapY = footY < block.y + 0.5 && footY + height > block.y - 0.5;
    if (overlapX && overlapZ && overlapY) overlaps.push(block);
  }
  const lower = overlaps.filter(block => block.y - 0.5 < middleY && block.y + 0.5 > footY);
  const upper = overlaps.filter(block => block.y + 0.5 > middleY && block.y - 0.5 < footY + height);
  if (lower.length !== 1 || upper.length !== 0) return null;
  const embedded = lower[0];
  const embeddedKey = coordKey(embedded.x, embedded.y, embedded.z);
  const targetEyeY = embedded.y + 2.15;
  const targetHeadTop = targetEyeY + (height - 1.65);
  for (const block of blocks.values()) {
    if (coordKey(block.x, block.y, block.z) === embeddedKey) continue;
    const overlapX = player.pos.x - 0.3 < block.x + 0.5 && player.pos.x + 0.3 > block.x - 0.5;
    const overlapZ = player.pos.z - 0.3 < block.z + 0.5 && player.pos.z + 0.3 > block.z - 0.5;
    const blocksJumpPath = block.y + 0.5 > middleY && block.y - 0.5 < targetHeadTop;
    if (overlapX && overlapZ && blocksJumpPath) return null;
  }
  return embedded;
}
function hasSneakSupport(x, z, feetY, moveX, moveZ) {
  const length = Math.hypot(moveX, moveZ) || 1;
  const backX = -moveX / length;
  const backZ = -moveZ / length;
  const sideX = -backZ * 0.27;
  const sideZ = backX * 0.27;
  const samples = [
    [x + backX * 0.27, z + backZ * 0.27],
    [x + backX * 0.27 + sideX, z + backZ * 0.27 + sideZ],
    [x + backX * 0.27 - sideX, z + backZ * 0.27 - sideZ]
  ];
  return samples.some(([sx, sz]) => {
    const bx = Math.floor(sx + 0.5), bz = Math.floor(sz + 0.5);
    const aroundY = Math.floor(feetY + 0.5);
    for (let by = aroundY - 2; by <= aroundY + 1; by++) {
      const block = blocks.get(coordKey(bx, by, bz));
      if (block && Math.abs(block.y + 0.5 - feetY) <= 0.22) return true;
    }
    return false;
  });
}
function findDropLandingTop(x, z, fromBottom, toBottom) {
  const halfSize = 0.15;
  let bestTop = null;
  for (const block of blocks.values()) {
    if (Math.abs(x - block.x) >= 0.5 + halfSize || Math.abs(z - block.z) >= 0.5 + halfSize) continue;
    const top = block.y + 0.5;
    const crossedSurface = fromBottom >= top - 0.001 && toBottom <= top + 0.001;
    const overlapsSurface = toBottom <= top && toBottom + halfSize * 2 >= top;
    if ((crossedSurface || overlapsSurface) && (bestTop === null || top > bestTop)) bestTop = top;
  }
  const fallbackTop = -2.5;
  if (fromBottom >= fallbackTop - 0.001 && toBottom <= fallbackTop + 0.001 && (bestTop === null || fallbackTop > bestTop)) {
    bestTop = fallbackTop;
  }
  return bestTop;
}

let previousTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - previousTime) / 1000, 0.05);
  previousTime = now;
  camera.rotation.set(player.pitch, player.yaw, 0);
  if (paused) { renderer.render(scene, camera); return; }
  if (keys[bindings.sneak]) player.sneaking = true;
  else if (!collides(player.pos.x, player.pos.y, player.pos.z, 2)) player.sneaking = false;
  const targetHeight = player.sneaking ? 1.75 : 2;
  player.height = THREE.MathUtils.damp(player.height, targetHeight, 14, dt);
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const movement = new THREE.Vector3();
  if (keys[bindings.forward]) movement.add(forward);
  if (keys[bindings.back]) movement.sub(forward);
  if (keys[bindings.right]) movement.add(right);
  if (keys[bindings.left]) movement.sub(right);
  if (movement.lengthSq()) movement.normalize();
  if (keys[bindings.jump] && player.onGround) { player.vel.y = 8.3; player.onGround = false; }
  const speed = player.sneaking ? 1.6 : keys[bindings.sprint] ? 6.3 : 5;
  player.vel.x = THREE.MathUtils.damp(player.vel.x, movement.x * speed, 12, dt);
  player.vel.z = THREE.MathUtils.damp(player.vel.z, movement.z * speed, 12, dt);
  const horizontalSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (horizontalSpeed > speed) { player.vel.x *= speed / horizontalSpeed; player.vel.z *= speed / horizontalSpeed; }
  player.vel.y -= 28 * dt;
  const startX = player.pos.x;
  const startZ = player.pos.z;
  const nextX = startX + player.vel.x * dt;
  const nextZ = startZ + player.vel.z * dt;
  const feetY = player.pos.y - 1.65;
  let candidateX = startX;
  let candidateZ = startZ;
  if (!collides(nextX, player.pos.y, startZ)) candidateX = nextX; else player.vel.x = 0;
  if (!collides(candidateX, player.pos.y, nextZ)) candidateZ = nextZ; else player.vel.z = 0;
  const actualMoveX = candidateX - startX;
  const actualMoveZ = candidateZ - startZ;
  if (player.sneaking && player.onGround && (actualMoveX || actualMoveZ) &&
      !hasSneakSupport(candidateX, candidateZ, feetY, actualMoveX, actualMoveZ)) {
    candidateX = startX;
    candidateZ = startZ;
    player.vel.x = 0;
    player.vel.z = 0;
  }
  player.pos.x = candidateX;
  player.pos.z = candidateZ;
  const nextY = player.pos.y + player.vel.y * dt;
  const ignoredEscapeBlock = player.vel.y > 0 ? escapeBlockKey : null;
  const verticalHit = collides(player.pos.x, nextY, player.pos.z, player.height, ignoredEscapeBlock);
  if (!verticalHit) { player.pos.y = nextY; player.onGround = false; }
  else if (player.vel.y > 0) {
    const bodyHeight = player.height;
    const ceiling = findCeilingSurface(player.pos.x, player.pos.z, player.pos.y, nextY, bodyHeight);
    if (ceiling) {
      player.pos.y = ceiling.bottom - (bodyHeight - 1.65);
      player.vel.y = -Math.max(3.5, player.vel.y * 0.35);
    } else {
      // Already embedded in a block: hold position instead of snapping to another voxel.
      player.vel.y = 0;
    }
    player.onGround = false;
  } else {
    const landing = findLandingSurface(player.pos.x, player.pos.z, player.pos.y, nextY);
    if (landing) {
      player.pos.y = landing.top + 1.65;
      player.onGround = true;
    } else {
      // Side or lower-body overlap is not a landing surface; remain embedded in place.
      player.onGround = false;
    }
    player.vel.y = 0;
  }
  if (escapeBlockKey) {
    const escapeBlock = blocks.get(escapeBlockKey);
    if (!escapeBlock || player.pos.y - 1.65 >= escapeBlock.y + 0.48) escapeBlockKey = null;
  }
  if (player.pos.y < -8) { player.pos.set(0, terrainHeight(0, 7) + 2.25, 7); player.vel.set(0, 0, 0); }
  camera.position.set(player.pos.x, player.pos.y - (2 - player.height), player.pos.z);
  document.querySelector('#coordX').textContent = player.pos.x.toFixed(1);
  document.querySelector('#coordY').textContent = player.pos.y.toFixed(1);
  document.querySelector('#coordZ').textContent = player.pos.z.toFixed(1);
  updateTargetAndBreaking(now);
  animateHeldItem(now);

  for (let i = drops.length - 1; i >= 0; i--) {
    const drop = drops[i];
    drop.mesh.rotation.y += dt * 1.5;
    if (drop.velocityX || drop.velocityZ) {
      drop.mesh.position.x += drop.velocityX * dt;
      drop.mesh.position.z += drop.velocityZ * dt;
      const friction = Math.exp(-3 * dt);
      drop.velocityX *= friction;
      drop.velocityZ *= friction;
      if (Math.hypot(drop.velocityX, drop.velocityZ) < 0.08) { drop.velocityX = 0; drop.velocityZ = 0; }
    }
    if (!drop.grounded) {
      drop.velocityY -= 18 * dt;
      const oldY = drop.mesh.position.y;
      const nextY = drop.mesh.position.y + drop.velocityY * dt;
      const groundTop = findDropLandingTop(drop.mesh.position.x, drop.mesh.position.z, oldY - 0.15, nextY - 0.15);
      if (groundTop !== null) {
        drop.restY = groundTop + 0.15;
        drop.mesh.position.y = drop.restY;
        drop.velocityY = 0;
        drop.grounded = true;
      } else {
        drop.mesh.position.y = nextY;
      }
    } else {
      drop.mesh.position.y = drop.restY + Math.sin(now * 0.003 + drop.phase) * 0.045;
    }
    if (now >= drop.pickupAt && drop.mesh.position.distanceTo(player.pos) < 1.65) {
      if (addItemToInventory(drop.type)) {
        collected++;
        document.querySelector('#collected').textContent = collected;
        scene.remove(drop.mesh);
        drops.splice(i, 1);
      }
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script></body></html>
