nslateY(-2px);box-shadow:0 7px 0 #86a93b}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #86a93b}.foot{margin-top:20px;font-size:9px;letter-spacing:.12em;color:#879491}
.coords{display:flex;align-items:center;gap:7px;padding:10px 13px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);font-family:'DotGothic16';font-size:11px;color:#dfe9e4}.coords span{color:#8faaa0;margin-left:5px}.coords b{font-weight:400;color:var(--lime);min-width:35px}.bottom{justify-content:center}.help{display:none}.crosshair{filter:none}.menu-overlay{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(7,17,20,.62);backdrop-filter:blur(7px);pointer-events:auto}.menu-overlay.show{display:grid}.menu-card{width:min(430px,calc(100vw - 36px));padding:30px 34px;background:rgba(15,27,31,.94);border:1px solid rgba(255,255,255,.25);box-shadow:0 24px 80px rgba(0,0,0,.28);text-align:center}.menu-card h1{font-family:'DotGothic16';font-size:30px;font-weight:400;margin:7px 0 20px}.menu-controls{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;text-align:left;font-size:11px;color:#d8e1dc;margin-bottom:23px}.menu-controls .key{display:inline-block}.menu-card .start{pointer-events:auto}

.menu-card [hidden]{display:none!important}.menu-actions{display:flex;justify-content:center;gap:10px}.menu-button,.binding-button{font-family:inherit;color:#eef2e8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);padding:10px 18px;cursor:pointer}.menu-button:hover,.binding-button:hover{border-color:var(--lime)}#settingsPanel h1{margin-bottom:10px}#settingsPanel h2{font-size:13px;color:var(--lime);margin:10px 0}.binding-list{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow-y:auto;padding:4px 8px 8px 4px;scrollbar-color:var(--lime) rgba(255,255,255,.08);scrollbar-width:thin}.binding-list::-webkit-scrollbar,.menu-card::-webkit-scrollbar{width:8px}.binding-list::-webkit-scrollbar-track,.menu-card::-webkit-scrollbar-track{background:rgba(255,255,255,.08);border-radius:8px}.binding-list::-webkit-scrollbar-thumb,.menu-card::-webkit-scrollbar-thumb{background:#91aa94;border:2px solid rgba(15,27,31,.94);border-radius:8px}.binding-group-title{margin:0 0 6px;color:var(--lime);font-size:12px;letter-spacing:.08em}.binding-group-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.binding-row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px;padding:6px 8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:4px;font-size:12px;color:#d8e1dc}.binding-button{min-width:96px;min-height:32px;padding:5px 8px;font-family:monospace;font-size:11px;font-weight:700;background:#253632;border:1px solid #91aa94;color:#fff}.binding-button.waiting{background:#4e5d27;color:#efffc7;border-color:var(--lime)}.sensitivity-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:10px 0 5px;color:#d8e1dc}#sensitivity{width:100%;accent-color:var(--lime);pointer-events:auto}.back-button{margin-top:12px}.inventory-overlay{position:fixed;inset:0;z-index:4;display:none;place-items:center;background:rgba(5,12,14,.38);pointer-events:auto}.inventory-overlay.show{display:grid}.inventory-panel{padding:18px;background:rgba(15,27,31,.94);border:1px solid rgba(255,255,255,.3);box-shadow:0 20px 65px #0008}.inventory-panel h2{font:20px 'DotGothic16';text-align:center;margin:0 0 14px}.inventory-grid{display:grid;grid-template-columns:repeat(9,54px);gap:4px}.inventory-grid .slot{width:54px;height:54px;cursor:pointer;background:rgba(255,255,255,.08)}.inventory-grid .slot.active{transform:none}.inventory-grid .slot .label{display:none}.inventory-grid .slot .swatch{width:26px;height:26px}.inventory-grid .tool-icon{width:34px;height:34px}.inventory-grid .slot .count,.hotbar .slot .count{z-index:1}.slot .count{pointer-events:none}.inventory-separator{height:10px;border-bottom:1px solid #ffffff30;margin-bottom:10px}.cursor-item{position:fixed;z-index:10;display:none;pointer-events:none;width:48px;height:48px;align-items:center;justify-content:center;background:#162321d9;border:1px solid var(--lime);transform:translate(-50%,-50%)}.cursor-item.show{display:flex}.cursor-item .swatch{width:30px;height:30px}.cursor-item .tool-icon{width:36px;height:36px}.cursor-item b{position:absolute;right:2px;bottom:0;font-size:11px;text-shadow:0 1px 3px #000}@media(max-width:640px){.binding-group-grid{grid-template-columns:1fr}.menu-card:has(#settingsPanel:not([hidden])){padding:20px 14px}.binding-row{font-size:11px;padding:5px}.binding-button{min-width:78px}.inventory-grid{grid-template-columns:repeat(9,34px);gap:3px}.inventory-grid .slot{width:34px;height:42px}.inventory-panel{padding:11px}.inventory-grid .tool-icon{width:27px;height:27px}}
/* Clearer control remapping: larger, higher contrast rows and more room for labels. */
.menu-card:has(#settingsPanel:not([hidden])){width:min(650px,calc(100vw - 36px));text-align:left;max-height:94vh;overflow-y:auto}#settingsPanel .eyebrow,#settingsPanel>h1,#settingsPanel>h2{text-align:center}.binding-group-grid{grid-template-columns:1fr}.binding-row{min-height:40px}.sensitivity-label{max-width:420px;margin-left:auto;margin-right:auto}#settingsPanel #sensitivity,#fieldOfView{display:block;width:100%;max-width:420px;margin-left:auto;margin-right:auto;accent-color:var(--lime);pointer-events:auto}.settings-range{margin-top:12px}.menu-card:has(#settingsPanel:not([hidden])){scrollbar-color:#91aa94 rgba(255,255,255,.08);scrollbar-width:thin}#settingsPanel .back-button{display:block;margin:16px auto 0}
.menu-overlay.show{display:grid}.menu-card:has(#worldListPanel:not([hidden])),.menu-card:has(#createWorldPanel:not([hidden])){width:min(700px,calc(100vw - 36px));text-align:left}.menu-card h1{margin-bottom:14px}#titlePanel h1{white-space:nowrap;font-size:clamp(20px,7vw,30px)}.menu-stack{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin:26px auto 0}.menu-stack .menu-button,.menu-stack .start,.world-row .start{width:100%;font-size:14px}.menu-stack .start{padding-left:12px;padding-right:12px}#titlePanel #worldMenuButton{white-space:nowrap}.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.menu-heading h1{margin:0}.world-list{display:flex;flex-direction:column;gap:9px;max-height:55vh;overflow-y:auto;padding:2px 6px 6px 2px;scrollbar-color:#91aa94 rgba(255,255,255,.08);scrollbar-width:thin}.world-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}.world-row h2{margin:0 0 3px;font-size:15px}.world-row p{margin:0;color:#aebbb7;font-size:11px}.world-row .start{width:auto;min-width:100px;padding:10px 18px}.world-empty,.world-error{padding:24px;text-align:center;color:#c6d2cf;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.2)}.world-error{color:#ffb4a9}.world-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.world-mode{min-height:160px;padding:20px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:var(--ink);cursor:pointer;font:inherit}.world-mode:hover{border-color:var(--lime);background:rgba(204,245,104,.09)}.world-mode strong{display:block;color:var(--lime);font-size:18px;margin-bottom:8px}.world-mode span{font-size:12px;line-height:1.8;color:#c6d2cf}.menu-error{margin:8px 0;color:#ffb4a9;font-size:12px}.menu-back{display:block;margin:12px auto 0}.menu-card [hidden]{display:none!important}#ui.menu-hidden{display:none}@media(max-width:600px){.world-mode-grid{grid-template-columns:1fr}.world-mode{min-height:120px}.world-row{gap:8px;padding:10px}.world-row .start{min-width:74px;padding:9px}.menu-heading{align-items:flex-start}}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui" class="menu-hidden"><div class="top"><div class="coords">X <b id="coordX">0.0</b><span>Y</span> <b id="coordY">0.0</b><span>Z</span> <b id="coordZ">0.0</b></div><div class="stats"><div class="pill">WORLD <b id="seed">----</b></div><div class="pill">拾った数 <b id="collected">0</b></div></div></div><div class="crosshair"></div><div class="bottom"><div class="vitals"><div class="hearts" id="hearts" aria-label="体力"></div><div class="hunger" id="hunger" aria-label="満腹度"></div></div><div class="hotbar" id="hotbar"></div></div></div>
<div class="menu-overlay show" id="menu"><div class="menu-card">
<div class="menu-error" id="worldStorageNotice" hidden></div>
<div id="titlePanel"><div class="eyebrow">ブロックの世界</div><h1>BLOCKLAND</h1><div class="menu-stack"><button class="start" id="worldMenuButton">ワールド</button><button class="menu-button" id="titleSettings">設定</button></div></div>
<div id="worldListPanel" hidden><div class="menu-heading"><h1>ワールド</h1><button class="start" id="newWorldButton">新規作成</button></div><div class="world-list" id="worldList"></div><div class="menu-error" id="worldListError" hidden></div><button class="menu-button menu-back" id="worldListBack">戻る</button></div>
<div id="createWorldPanel" hidden><div class="eyebrow">NEW WORLD</div><h1>ワールドを作成</h1><div class="world-mode-grid"><button class="world-mode" data-mode="survival"><strong>サバイバル</strong><span>シード2026の地形で、ブロックを集めながら遊びます。</span></button><button class="world-mode" data-mode="creative"><strong>クリエイティブ</strong><span>草・土・石の平坦な地形。全ブロックを使え、破壊は一瞬です。</span></button></div><div class="menu-error" id="createWorldError" hidden></div><button class="menu-button menu-back" id="createWorldBack">戻る</button></div>
<div id="pausePanel" hidden><h1>一時停止中</h1><div class="menu-stack"><button class="start" id="resume">ゲームに戻る</button><button class="menu-button" id="pauseSettings">設定</button><button class="menu-button" id="leaveWorld">ワールドを抜ける</button></div></div>
<div id="settingsPanel" hidden><div class="eyebrow">SETTINGS</div><h1>設定</h1><h2>キー操作</h2><div class="binding-list" id="bindingList"></div><label class="sensitivity-label" for="sensitivity">マウス感度 <output id="sensitivityValue">1.0</output></label><input id="sensitivity" type="range" min="0.2" max="3" step="0.1" value="1"><button class="menu-button back-button" id="settingsBack">戻る</button></div>
</div></div>
<div id="inventoryOverlay" class="inventory-overlay"><div class="inventory-panel"><h2>インベントリ</h2><div id="inventoryGrid" class="inventory-grid"></div><div class="inventory-separator"></div><div id="inventoryHotbar" class="inventory-grid"></div></div></div><div id="cursorItem" class="cursor-item"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { BLOCK_TYPES, FIXED_SURVIVAL_SEED, createWorldRecord, readWorlds, writeWorlds } from './world-store.js';

const TYPES = BLOCK_TYPES;
const LABELS = { grass: '草', dirt: '土', stone: '石', wood: '木', leaves: '葉' };
const COLORS = { grass: 0x71ba55, dirt: 0x8d6243, stone: 0x8a9297, wood: 0x95633c, leaves: 0x4f914b };
const CSS_COLORS = { grass: '#71ba55', dirt: '#8d6243', stone: '#8a9297', wood: '#95633c', leaves: '#4f914b' };
const makeStack = (id, count = 1) => {
  const tool = id.startsWith('iron_');
  const labels = { iron_sword: '鉄の剣', iron_pickaxe: '鉄のツルハシ', iron_axe: '鉄の斧', stone: '石', wood: '木', dirt: '土', grass: '草', leaves: '葉' };
  return { id, label: labels[id] || id, ...(tool ? { tool: true } : { type: id }), count: tool ? 1 : count };
};
const HOTBAR = [makeStack('iron_sword'), makeStack('iron_pickaxe'), makeStack('iron_axe'), null, makeStack('stone', 8), makeStack('wood', 8), makeStack('dirt', 12), makeStack('grass', 24), makeStack('leaves', 6)];
const INVENTORY_SLOTS = Array(27).fill(null);
const blocks = new Map();
const drops = [];
const keys = Object.create(null);
const random = Math.random;
let worlds = [];
let currentWorld = null;
let gameMode = 'survival';
let worldSaveTimer = 0;
let lastAutosave = 0;
const DEFAULT_BINDINGS = {
  forward: 'KeyW', back: 'KeyS', left: 'KeyA', right: 'KeyD', jump: 'Space',
  sneak: 'Tab', sprint: 'ShiftLeft', drop: 'KeyQ', inventory: 'KeyE',
  hotbar1: 'Digit1', hotbar2: 'Digit2', hotbar3: 'Digit3', hotbar4: 'Digit4', hotbar5: 'Digit5',
  hotbar6: 'Digit6', hotbar7: 'Digit7', hotbar8: 'Digit8', hotbar9: 'Digit9'
};
const BINDING_GROUPS = [
  { title: 'スロット操作', actions: Array.from({ length: 9 }, (_, index) => [`hotbar${index + 1}`, `スロット ${index + 1}`]) },
  { title: '移動操作', actions: [['forward', '前進'], ['back', '後退'], ['left', '左移動'], ['right', '右移動'], ['jump', 'ジャンプ'], ['sneak', 'スニーク'], ['sprint', 'ダッシュ']] },
  { title: 'アクション操作', actions: [['inventory', 'インベントリ'], ['drop', 'アイテムを落とす']] }
];
const SETTINGS_STORAGE_KEY = 'blockland-controls-v1';
let bindings = { ...DEFAULT_BINDINGS };
let mouseSensitivity = 1;
let fieldOfViewPercent = 90;
let rebindingAction = null;
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || '{}');
  if (saved.bindings) for (const action of Object.keys(DEFAULT_BINDINGS)) {
    if (typeof saved.bindings[action] === 'string') bindings[action] = saved.bindings[action];
  }
  if (Number.isFinite(saved.sensitivity)) mouseSensitivity = THREE.MathUtils.clamp(saved.sensitivity, 0.2, 3);
  if (Number.isFinite(saved.fieldOfView)) fieldOfViewPercent = THREE.MathUtils.clamp(saved.fieldOfView, 60, 120);
} catch {}
function saveControlSettings() {
  try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify({ bindings, sensitivity: mouseSensitivity, fieldOfView: fieldOfViewPercent })); } catch {}
}
function formatBinding(code) {
  if (code === 'Mouse4') return 'マウス戻る';
  if (code === 'Mouse5') return 'マウス進む';
  if (code === 'Space') return 'SPACE';
  if (code === 'Tab') return 'TAB';
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return `Num ${code.slice(6)}`;
  if (code === 'ShiftLeft') return '左Shift';
  if (code === 'ShiftRight') return '右Shift';
  return code.replace('Arrow', '矢印');
}
function renderBindingSettings() {
  const list = document.querySelector('#bindingList');
  if (!list) return;
  list.innerHTML = '';
  for (const group of BINDING_GROUPS) {
    const section = document.createElement('section');
    const heading = document.createElement('h3');
    heading.className = 'binding-group-title';
    heading.textContent = group.title;
    const grid = document.createElement('div');
    grid.className = 'binding-group-grid';
    for (const [action, label] of group.actions) {
      const row = document.createElement('div');
      row.className = 'binding-row';
      const name = document.createElement('span');
      name.textContent = label;
      const button = document.createElement('button');
      button.className = `binding-button${rebindingAction === action ? ' waiting' : ''}`;
      button.type = 'button';
      button.textContent = rebindingAction === action ? 'キーを押す' : formatBinding(bindings[action]);
      button.addEventListener('click', () => {
        rebindingAction = action;
        renderBindingSettings();
      });
      row.append(name, button);
      grid.appendChild(row);
    }
    section.append(heading, grid);
    list.appendChild(section);
  }
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd8ed);
scene.fog = new THREE.Fog(0x9bd8ed, 25, 62);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
const baseFieldOfView = camera.fov;
let displayedFieldOfView = camera.fov;
camera.rotation.order = 'YXZ';
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.querySelector('#game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9f6ff, 0x647956, 2.0));
const sun = new THREE.DirectionalLight(0xfff1ce, 2.6);
sun.position.set(-18, 32, 16);
scene.add(sun);

const materials = Object.fromEntries(TYPES.map(type => [type, new THREE.MeshLambertMaterial({ color: COLORS[type] })]));
const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
const instanceMeshes = new Map();
let blockInstances = [];
const coordKey = (x, y, z) => `${x},${y},${z}`;

function terrainHeight(x, z) {

  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const movement = new THREE.Vector3();
  if (keys[bindings.forward]) movement.add(forward);
  if (keys[bindings.back]) movement.sub(forward);
  if (keys[bindings.right]) movement.add(right);
  if (keys[bindings.left]) movement.sub(right);
  if (movement.lengthSq()) movement.normalize();
  jumpBoostTime = Math.max(0, jumpBoostTime - dt);
  const speed = player.sneaking ? 1.6 : sprinting ? 6.3 : 5;
  const movementSpeed = jumpBoostTime > 0 ? Math.max(speed, jumpBoostMaxSpeed) : speed;
  player.vel.x = THREE.MathUtils.damp(player.vel.x, movement.x * movementSpeed, 12, dt);
  player.vel.z = THREE.MathUtils.damp(player.vel.z, movement.z * movementSpeed, 12, dt);
  const horizontalSpeed = Math.hypot(player.vel.x, player.vel.z);
  const maxHorizontalSpeed = movementSpeed;
  if (horizontalSpeed > maxHorizontalSpeed) { player.vel.x *= maxHorizontalSpeed / horizontalSpeed; player.vel.z *= maxHorizontalSpeed / horizontalSpeed; }
  player.vel.y -= 28 * dt;
  const startX = player.pos.x;
  const startZ = player.pos.z;
  const nextX = startX + player.vel.x * dt;
  const nextZ = startZ + player.vel.z * dt;
  const feetY = player.pos.y - 1.65;
  let candidateX = startX;
  let candidateZ = startZ;
  const hitX = !!collides(nextX, player.pos.y, startZ);
  const hitZ = !!collides(candidateX, player.pos.y, nextZ);
  if (!hitX) candidateX = nextX; else player.vel.x = 0;
  if (!hitZ) candidateZ = nextZ; else player.vel.z = 0;
  const actualMoveX = candidateX - startX;
  const actualMoveZ = candidateZ - startZ;
  if (player.sneaking && player.onGround && (actualMoveX || actualMoveZ) &&
      !hasSneakSupport(candidateX, candidateZ, feetY, actualMoveX, actualMoveZ)) {
    candidateX = startX;
    candidateZ = startZ;
    player.vel.x = 0;
    player.vel.z = 0;
  }
  player.pos.x = candidateX;
  player.pos.z = candidateZ;
  const requestedFov = baseFieldOfView * fieldOfViewPercent / 90 + (sprinting ? 10 : 0);
  displayedFieldOfView = THREE.MathUtils.damp(displayedFieldOfView, requestedFov, 8, dt);
  if (Math.abs(requestedFov - displayedFieldOfView) <= 0.01) displayedFieldOfView = requestedFov;
  if (camera.fov !== displayedFieldOfView) {
    camera.fov = displayedFieldOfView;
    camera.updateProjectionMatrix();
  }
  const nextY = player.pos.y + player.vel.y * dt;
  const ignoredEscapeBlock = player.vel.y > 0 ? escapeBlockKey : null;
  const verticalHit = collides(player.pos.x, nextY, player.pos.z, player.height, ignoredEscapeBlock);
  const landing = player.vel.y <= 0
    ? findLandingSurface(player.pos.x, player.pos.z, player.pos.y, nextY)
    : null;
  if (landing) {
    player.pos.y = landing.top + 1.65;
    player.vel.y = 0;
    player.onGround = true;
  } else if (!verticalHit) { player.pos.y = nextY; player.onGround = false; }
  else if (player.vel.y > 0) {
    const bodyHeight = player.height;
    const ceiling = findCeilingSurface(player.pos.x, player.pos.z, player.pos.y, nextY, bodyHeight);
    if (ceiling) {
      player.pos.y = ceiling.bottom - (bodyHeight - 1.65);
      player.vel.y = -Math.max(3.5, player.vel.y * 0.35);
    } else {
      // Already embedded in a block: hold position instead of snapping to another voxel.
      player.vel.y = 0;
    }
    player.onGround = false;
  } else {
    player.onGround = false;
    player.vel.y = 0;
  }
  if (escapeBlockKey) {
    const escapeBlock = blocks.get(escapeBlockKey);
    if (!escapeBlock || player.pos.y - 1.65 >= escapeBlock.y + 0.48) escapeBlockKey = null;
  }
  if (player.pos.y < -8) { player.pos.set(0, terrainHeight(0, 7) + 2.4, 7); player.vel.set(0, 0, 0); }
  camera.position.set(player.pos.x, player.pos.y - (2 - player.height), player.pos.z);
  document.querySelector('#coordX').textContent = player.pos.x.toFixed(1);
  document.querySelector('#coordY').textContent = player.pos.y.toFixed(1);
  document.querySelector('#coordZ').textContent = player.pos.z.toFixed(1);
  updateTargetAndBreaking(now);
  animateHeldItem(now);
  if (now - lastAutosave >= 5000) {
    lastAutosave = now;
    scheduleWorldSave();
  }

  for (let i = drops.length - 1; i >= 0; i--) {
    const drop = drops[i];
    drop.mesh.rotation.y += dt * 1.5;
    if (drop.velocityX || drop.velocityZ) {
      drop.mesh.position.x += drop.velocityX * dt;
      drop.mesh.position.z += drop.velocityZ * dt;
      const friction = Math.exp(-3 * dt);
      drop.velocityX *= friction;
      drop.velocityZ *= friction;
      if (Math.hypot(drop.velocityX, drop.velocityZ) < 0.08) { drop.velocityX = 0; drop.velocityZ = 0; }
    }
    if (!drop.grounded) {
      drop.velocityY -= 18 * dt;
      const oldY = drop.mesh.position.y;
      const nextY = drop.mesh.position.y + drop.velocityY * dt;
      const groundTop = findDropLandingTop(drop.mesh.position.x, drop.mesh.position.z, oldY - 0.15, nextY - 0.15);
      if (groundTop !== null) {
        drop.restY = groundTop + 0.15;
        drop.mesh.position.y = drop.restY;
        drop.velocityY = 0;
        drop.grounded = true;
      } else {
        drop.mesh.position.y = nextY;
      }
    } else {
      drop.mesh.position.y = drop.restY + Math.sin(now * 0.003 + drop.phase) * 0.045;
    }
    if (now >= drop.pickupAt && drop.mesh.position.distanceTo(player.pos) < 1.65) {
      const added = addItemToInventory(drop.type, drop.count);
      if (added) {
        collected += added;
        document.querySelector('#collected').textContent = collected;
        drop.count -= added;
        if (drop.count <= 0) {
          scene.remove(drop.mesh);
          if (drop.tool) drop.mesh.material.dispose();
          else drop.mesh.geometry.dispose();
          drops.splice(i, 1);
        }
      }
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script></body></html>
